{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Hostel Management System
        {% endblock %}
    </title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#f4f7fc;
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }

        .navbar{
            background:linear-gradient(90deg,#0f172a,#1e40af);
        }

        .navbar-brand{
            color:white !important;
            font-weight:bold;
            font-size:24px;
        }

        .nav-link{
            color:white !important;
        }

        .main-content{
            flex:1;
            padding:30px;
        }

        .card-custom{
            border:none;
            border-radius:20px;
            box-shadow:0px 5px 20px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .card-custom:hover{
            transform:translateY(-8px);
        }

        .footer{
            background:#0f172a;
            color:white;
            text-align:center;
            padding:15px;
        }

        .dashboard-card{
            border-radius:20px;
            color:white;
            padding:30px;
            transition:0.4s;
            cursor:pointer;
        }

        .dashboard-card:hover{
            transform:scale(1.05);
        }

        .bg1{
            background:linear-gradient(45deg,#2563eb,#60a5fa);
        }

        .bg2{
            background:linear-gradient(45deg,#16a34a,#4ade80);
        }

        .bg3{
            background:linear-gradient(45deg,#dc2626,#fb7185);
        }

        .bg4{
            background:linear-gradient(45deg,#9333ea,#c084fc);
        }

        .page-title{
            font-weight:bold;
            color:#1e3a8a;
            margin-bottom:30px;
        }

        table{
            background:white;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/">
            <i class="fa-solid fa-hotel"></i>
            Hostel Management
        </a>

    </div>

</nav>

<div class="container-fluid main-content">

    {% block content %}
    {% endblock %}

</div>

<footer class="footer">
    © 2026 Hostel Management System | Developed Using Django
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
