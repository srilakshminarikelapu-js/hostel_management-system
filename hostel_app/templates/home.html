<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hostel Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#3b82f6);
            overflow-x:hidden;
        }

        .hero{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .glass-card{
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.2);
            border-radius:25px;
            padding:50px;
            text-align:center;
            color:white;
            box-shadow:0 15px 35px rgba(0,0,0,0.3);
        }

        .main-title{
            font-size:3rem;
            font-weight:bold;
        }

        .subtitle{
            font-size:1.2rem;
            margin-bottom:30px;
            opacity:0.9;
        }

        .btn-custom{
            padding:15px 35px;
            border-radius:50px;
            font-size:18px;
            font-weight:600;
            transition:0.4s;
        }

        .btn-custom:hover{
            transform:translateY(-5px);
        }

        .feature-box{
            background:white;
            border-radius:15px;
            padding:20px;
            margin-top:20px;
            color:#333;
            transition:0.3s;
        }

        .feature-box:hover{
            transform:scale(1.05);
        }

    </style>

</head>

<body>

<div class="container hero">

    <div class="glass-card col-lg-8">

        <i class="fa-solid fa-hotel fa-4x mb-4"></i>

        <h1 class="main-title">
            Hostel Management System
        </h1>

        <p class="subtitle">
            Smart Hostel Administration & Student Management Portal
        </p>

        <div class="mt-4">

            <a href="{% url 'student_login' %}"
               class="btn btn-success btn-custom me-3">
                <i class="fa-solid fa-user-graduate"></i>
                Student Login
            </a>

            <a href="{% url 'register' %}"
            class="btn btn-success btn-lg">

                Student Registration

            </a>
            
            <a href="{% url 'admin_login' %}"
               class="btn btn-warning btn-custom">
                <i class="fa-solid fa-user-shield"></i>
                Admin Login
            </a>

        </div>

        <div class="row mt-5">

            <div class="col-md-4">
                <div class="feature-box">
                    <i class="fa-solid fa-bed fa-2x text-primary"></i>
                    <h5 class="mt-3">Room Registration</h5>
                    <p>Apply for hostel rooms online.</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="feature-box">
                    <i class="fa-solid fa-circle-exclamation fa-2x text-danger"></i>
                    <h5 class="mt-3">Complaint System</h5>
                    <p>Raise and track complaints instantly.</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="feature-box">
                    <i class="fa-solid fa-chart-line fa-2x text-success"></i>
                    <h5 class="mt-3">Smart Management</h5>
                    <p>Easy room allocation and monitoring.</p>
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
