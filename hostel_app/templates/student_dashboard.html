<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
</head>
<body>
    {% extends 'base.html' %}

    {% block title %}
    Student Dashboard
    {% endblock %}

    {% block content %}

    <h2 class="page-title">
        Student Dashboard
    </h2>

    <div class="row">

        <div class="col-md-4 mb-4">

            <a href="{% url 'register_room' %}"
            class="text-decoration-none">

                <div class="dashboard-card bg1">

                    <i class="fa-solid fa-bed fa-3x"></i>

                    <h4 class="mt-3">
                        Register For Room
                    </h4>

                </div>

            </a>

        </div>

        <div class="col-md-4 mb-4">

            <a href="{% url 'add_complaint' %}"
            class="text-decoration-none">

                <div class="dashboard-card bg2">

                    <i class="fa-solid fa-circle-exclamation fa-3x"></i>

                    <h4 class="mt-3">
                        Add Complaint
                    </h4>

                </div>

            </a>

        </div>

        <div class="col-md-4 mb-4">

            <a href="{% url 'complaint_status' %}"
            class="text-decoration-none">

                <div class="dashboard-card bg3">

                    <i class="fa-solid fa-list-check fa-3x"></i>

                    <h4 class="mt-3">
                        Complaint Status
                    </h4>

                </div>

            </a>
            <a href="{% url 'my_room' %}">
                My Room Allocation
            </a>

        </div>

    </div>

    <div class="mt-4">

        <a href="{% url 'logout' %}"
        class="btn btn-danger">

            Logout

        </a>

    </div>

    {% endblock %}
</body>
</html>
