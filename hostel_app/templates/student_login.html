<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
</head>
<body>
    {% extends 'base.html' %}

    {% block title %}
    Student Login
    {% endblock %}

    {% block content %}

    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card card-custom p-4">

                <h2 class="text-center text-primary mb-4">
                    Student Login
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label>Username</label>

                        <input type="text"
                            name="username"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>

                    <button class="btn btn-success w-100">
                        Login
                    </button>

                </form>

            </div>

        </div>

    </div>

    {% endblock %}
</body>
</html>
