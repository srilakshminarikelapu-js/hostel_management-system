<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Complaint</title>
</head>
<body>
    {% extends 'base.html' %}

    {% block title %}
    Add Complaint
    {% endblock %}

    {% block content %}

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card card-custom">

                <div class="card-header bg-danger text-white">

                    <h3>

                        <i class="fa-solid fa-circle-exclamation"></i>

                        Submit Complaint

                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">

                                Complaint Details

                            </label>

                            <textarea
                                name="complaint_text"
                                rows="6"
                                class="form-control"
                                placeholder="Describe your issue..."
                                required></textarea>

                        </div>

                        <button class="btn btn-danger">
                            Submit Complaint
                        </button>

                        <a href="{% url 'student_dashboard' %}"
                        class="btn btn-secondary">
                            Back
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

    {% endblock %}
</body>
</html>
